# Render Blueprint for the NWIS unified backend. Deploy by connecting this
# repo to Render and choosing "New > Blueprint" — Render reads this file
# and creates the service below automatically. See
# AUDIT/16_DEPLOYMENT_GUIDE.md for the full step-by-step walkthrough.
#
# Database: Supabase (free tier — PostGIS + pgvector), not Render's own
# managed Postgres (which offers neither). database/schema.sql no longer
# requires TimescaleDB either, so Supabase's plain Postgres is sufficient
# with zero further schema changes. Set NWIS_DATABASE_URL below to the
# Supabase connection string once the project is created.
#
# LLM: Gemini (gemini-flash-lite-latest, the cheapest flash tier) replaces
# the local-Ollama design — no
# GPU/persistent-compute budget exists on Render's free tier for a
# self-hosted model. Three separate free-tier Google account API keys are
# rotated on failure (see modules/02_nwis_backend/agent/orchestrator.py)
# to multiply the effective free request quota; the Copilot still falls
# back to deterministic keyword search if all three are exhausted/unset.

services:
  - type: web
    name: nwis-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NWIS_ENV
        value: production
      - key: NWIS_API_KEY
        sync: false   # set manually in the Render dashboard — never commit a real key here
      - key: NWIS_CORS_ORIGINS
        sync: false   # set to your deployed Vercel frontend origin, e.g. https://your-app.vercel.app
      - key: NWIS_DATABASE_URL
        sync: false   # the Supabase project's connection string
      - key: GEMINIKEY1
        sync: false
      - key: GEMINIKEY2
        sync: false
      - key: GEMINIKEY3
        sync: false
    # /ready, not /health. This is the platform's "should I restart this
    # container?" probe, and it must answer only that question. /health is an
    # aggregate dependency rollup -- it reports on the database too -- so
    # pointing the healthcheck at it means a Supabase hiccup restarts a process
    # that is otherwise serving traffic perfectly well. Restarting fixes nothing
    # about the database and throws away the loaded NWIS store and the running
    # simulation state. /ready (Backend/app/main.py) is three in-memory reads,
    # no I/O, and cannot time out. /health stays available for humans and the
    # frontend's status UI.
    healthCheckPath: /ready
