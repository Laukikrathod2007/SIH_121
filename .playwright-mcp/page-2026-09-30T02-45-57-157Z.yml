              - generic [ref=f24e187]: How to read AUC
              - text: "0.5 means no better than chance, 1.0 means every true case is ranked above every non-case. With 10–14 past cases per hazard on a 12-well testbed these are modest, honest numbers; they improve as more offset reports are ingested. Method: Logistic regression per hazard on depth/formation/trajectory features; leave-one-well-out cross-validation (each fold holds out one entire well)."
