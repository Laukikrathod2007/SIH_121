[pytest]
# Backend tests:        cd Backend && pytest
# EVERY suite at once:  cd Backend && python run_tests.py
#   (the four legacy module suites each define a package literally named
#    `tests`, so run_tests.py gives each its own pytest process -- which also
#    isolates their singletons from one another.)
#
# pythonpath  : the import root that makes `app` importable (config-level, no
#               runtime sys.path edits anywhere in the code under test).
# import-mode : importlib, so test collection never inserts test directories
#               into sys.path (which would make legacy bare names such as
#               `models` / `api` importable again).
pythonpath = .
addopts = --import-mode=importlib -ra -p no:cacheprovider
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    unit: pure unit tests -- no app startup, no network, no database
    contract: in-process HTTP tests against the assembled app (FastAPI TestClient, no real socket)
    integration: needs a REAL running server on localhost:8000 (python run.py) and/or real services; skipped when unreachable
    db: needs a reachable PostgreSQL/PostGIS (localhost:5433 by default); skipped when unreachable
filterwarnings =
    ignore::DeprecationWarning
