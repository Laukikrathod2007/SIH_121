services:
  nwis_db:
    build: .
    container_name: nwis_database
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: nwis_dev_password
    ports:
      # 5433, not 5432 -- this machine already has an unrelated Postgres
      # container (sih26100_postgres) bound to 5432.
      - "5433:5432"
    volumes:
      - nwis_db_data:/home/postgres/pgdata/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nwis_db_data:
