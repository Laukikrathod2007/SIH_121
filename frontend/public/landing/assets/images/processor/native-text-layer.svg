<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" role="img" aria-labelledby="title desc">
  <title id="title">Native drilling report text detection</title>
  <desc id="desc">A born-digital daily drilling report yields selectable text without OCR.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e9dfd1" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5a4934" flood-opacity=".13"/></filter>
  </defs>
  <rect width="720" height="750" fill="#faf7f1"/><rect width="720" height="750" fill="url(#grid)" opacity=".75"/>
  <g filter="url(#shadow)" transform="rotate(-5 300 370)">
    <rect x="112" y="130" width="385" height="500" rx="10" fill="#fffdfa" stroke="#d7cec0" stroke-width="2"/>
    <path d="M150 188h180M150 214h295M150 240h262" stroke="#bdb5a8" stroke-width="7" stroke-linecap="round"/>
    <text x="150" y="170" fill="#70685f" font-family="monospace" font-size="13" letter-spacing="2">WELL NHK-44 · DAILY REPORT</text>
    <path d="M150 294h292M150 322h254M150 350h278M150 378h216M150 438h288M150 466h251M150 494h275M150 522h198" stroke="#b8b1a5" stroke-width="6" stroke-linecap="round" opacity=".72"/>
    <rect class="text-select" x="138" y="425" width="318" height="52" rx="4" fill="#f8d9b5" fill-opacity=".34" stroke="#c96a12" stroke-width="2"/>
    <path d="M150 566h266M150 588h220" stroke="#c8c0b4" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path class="connector" d="M450 450C520 440 512 335 550 310" fill="none" stroke="#c96a12" stroke-width="2" stroke-dasharray="5 7"/>
  <g class="token-layer">
    <rect x="470" y="180" width="174" height="126" rx="12" fill="#fffdfa" stroke="#e1d7ca" stroke-width="2"/>
    <rect x="488" y="198" width="9" height="9" rx="2" fill="#c96a12"/>
    <text x="506" y="207" fill="#a75208" font-family="monospace" font-size="12" letter-spacing="1">TEXT LAYER</text>
    <text x="490" y="246" fill="#39342e" font-family="monospace" font-size="18">3,248 m MD</text>
    <text x="490" y="277" fill="#777066" font-family="monospace" font-size="12">612 WORDS · 0 OCR</text>
  </g>
  <g transform="translate(450 530)"><rect width="178" height="46" rx="23" fill="#fbe8d3" stroke="#e2b17f"/><circle cx="25" cy="23" r="7" fill="#c96a12"/><text x="43" y="28" fill="#8a4006" font-family="monospace" font-size="12" letter-spacing="1">NATIVE TEXT</text></g>
  <style>
    .text-select{animation:select 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .token-layer{animation:rise 3.6s cubic-bezier(.2,.8,.2,1) infinite}
    .connector{stroke-dasharray:5 7;animation:flow 1.2s linear infinite}
    @keyframes select{0%,15%,100%{opacity:.38;transform:scale(.98)}45%,75%{opacity:1;transform:scale(1)}}
    @keyframes rise{0%,10%{opacity:0;transform:translate(0,14px)}32%,82%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(0,-5px)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</svg>
