<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" role="img" aria-labelledby="title desc">
  <title id="title">Physics checks validate extracted drilling data</title>
  <desc id="desc">Extracted measurements are checked for units, depth range, and drilling physics.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e9dfd1" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#5a4934" flood-opacity=".12"/></filter>
  </defs>
  <rect width="720" height="750" fill="#faf7f1"/><rect width="720" height="750" fill="url(#grid)" opacity=".75"/>
  <g filter="url(#shadow)"><rect x="76" y="124" width="568" height="472" rx="18" fill="#fffdfa" stroke="#d9d0c4" stroke-width="2"/></g>
  <text x="112" y="174" fill="#7a7166" font-family="monospace" font-size="12" letter-spacing="2">PHYSICS VALIDATION · NHK-44</text>
  <g transform="translate(112 218)"><rect width="492" height="82" rx="10" fill="#fbf8f2" stroke="#e5ddd2"/><text x="24" y="32" fill="#80776b" font-family="monospace" font-size="12">MUD WEIGHT</text><text x="24" y="62" fill="#302c26" font-family="monospace" font-size="20">13.2 ppg</text><circle cx="452" cy="41" r="15" fill="#fbe8d3" stroke="#c96a12"/><path class="check check-one" d="m445 41 5 5 10-12" fill="none" stroke="#a75208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(112 322)"><rect width="492" height="82" rx="10" fill="#fbf8f2" stroke="#e5ddd2"/><text x="24" y="32" fill="#80776b" font-family="monospace" font-size="12">BIT DEPTH</text><text x="24" y="62" fill="#302c26" font-family="monospace" font-size="20">3,248 m MD</text><circle cx="452" cy="41" r="15" fill="#fbe8d3" stroke="#c96a12"/><path class="check check-two" d="m445 41 5 5 10-12" fill="none" stroke="#a75208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(112 426)"><rect width="492" height="82" rx="10" fill="#fbf8f2" stroke="#e5ddd2"/><text x="24" y="32" fill="#80776b" font-family="monospace" font-size="12">ECD vs. PORE PRESSURE</text><text x="24" y="62" fill="#302c26" font-family="monospace" font-size="20">Within safe window</text><circle cx="452" cy="41" r="15" fill="#fbe8d3" stroke="#c96a12"/><path class="check check-three" d="m445 41 5 5 10-12" fill="none" stroke="#a75208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(112 540)"><rect width="492" height="30" rx="15" fill="#eee7dc"/><rect class="progress" width="492" height="30" rx="15" fill="#e9b57f"/><text x="22" y="20" fill="#653a16" font-family="monospace" font-size="10" letter-spacing="1">3 / 3 CHECKS PASSED</text></g>
  <style>
    .check{stroke-dasharray:24;stroke-dashoffset:24;animation:draw-check 2.7s ease-in-out infinite}
    .check-two{animation-delay:.35s}.check-three{animation-delay:.7s}
    .progress{transform-box:fill-box;transform-origin:left;animation:fill-bar 3s ease-in-out infinite}
    @keyframes draw-check{0%,12%{stroke-dashoffset:24;opacity:.2}32%,86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.75}}
    @keyframes fill-bar{0%,15%{transform:scaleX(.12)}72%,100%{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;transform:none!important}}
  </style>
</svg>
